media:
  - name: images
    label: Imagens dos projetos
    input: media/images
    output: /media/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: downloads
    label: Downloads
    input: downloads
    output: /downloads
    categories: [compressed]
    extensions: [zip]
    rename: safe

content:
  - name: projetos
    label: Projetos
    type: collection
    path: _projetos
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - category
        - platforms
        - status
        - version
    actions:
      - name: organize-project-media
        label: Organizar e otimizar imagens
        scope: entry
        workflow: process-project-media.yml
        ref: current
        confirm:
          title: Processar imagens deste projeto?
          message: As imagens serão redimensionadas, convertidas para WebP, reunidas na pasta deste projeto e os caminhos serão atualizados.
          button: Processar imagens
    fields:
      - name: title
        label: Nome do jogo
        type: string
        required: true
      - name: category
        label: Categoria
        type: select
        options:
          values:
            - Tradução
            - Port
            - Projeto
      - name: platforms
        label: Plataformas
        type: select
        description: Selecione todas as plataformas em que este projeto está disponível ou será lançado.
        options:
          multiple: true
          values:
            - Nintendo Switch 2
            - Nintendo Switch
            - PC
            - PlayStation 5
            - PlayStation 4
            - PlayStation 3
            - Xbox Series X|S
            - Xbox One
            - Xbox 360
            - Wii U
            - Wii
            - Nintendo 3DS
            - Nintendo DS
            - PlayStation Vita
            - PSP
            - Android
            - iOS
      - name: platform
        label: Plataforma antiga (compatibilidade)
        type: string
        hidden: true
      - name: status
        label: Status
        type: select
        options:
          values:
            - Concluído
            - Em andamento
            - Cancelado
            - Em planejamento
      - name: version
        label: Versão
        type: string
      - name: date
        label: Data de publicação
        type: date
      - name: icon
        label: Ícone do card na página inicial
        type: image
        options:
          media: images
          path: projetos
          extensions: [png, jpg, jpeg, webp]
      - name: cover
        label: Imagem de título / capa da página
        type: image
        options:
          media: images
          path: projetos
          extensions: [jpg, jpeg, png, webp]
      - name: screenshots
        label: Galeria antiga (mantida para projetos existentes)
        type: image
        hidden: true
        options:
          media: images
          path: projetos
          multiple:
            max: 4
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_1
        label: Screenshot 1
        type: image
        options:
          media: images
          path: projetos
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_2
        label: Screenshot 2
        type: image
        options:
          media: images
          path: projetos
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_3
        label: Screenshot 3
        type: image
        options:
          media: images
          path: projetos
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_4
        label: Screenshot 4
        type: image
        options:
          media: images
          path: projetos
          extensions: [jpg, jpeg, png, webp]
      - name: game_info
        label: Informações do jogo original (complementares)
        type: object
        description: Seção separada para dados do jogo original. Esses campos são opcionais e aparecem na página depois das screenshots e antes do vídeo. Preencha somente o que souber; não são informações do projeto de tradução ou port.
        fields:
          - name: developer
            label: Desenvolvedora
            type: string
          - name: publisher
            label: Publisher / Distribuidora
            type: string
          - name: release_year
            label: Ano de lançamento
            type: string
            description: Ex.: 2018.
          - name: genre
            label: Gênero
            type: string
          - name: synopsis
            label: Sinopse do jogo
            type: text
          - name: multiplayer
            label: Possui multiplayer?
            type: select
            options:
              values:
                - Sim
                - Não
          - name: local_multiplayer
            label: Multiplayer local?
            type: select
            options:
              values:
                - Sim
                - Não
          - name: online_multiplayer
            label: Multiplayer online?
            type: select
            options:
              values:
                - Sim
                - Não
          - name: players
            label: Quantidade de jogadores
            type: string
            description: Ex.: 1 jogador, 1–4 jogadores, até 8 online.
          - name: multiplayer_details
            label: Detalhes do multiplayer
            type: text
            description: Ex.: cooperativo, competitivo, tela dividida, jogo em equipe.
      - name: youtube
        label: Link do vídeo no YouTube
        type: string
        description: Cole o link completo do vídeo do YouTube (opcional).
      - name: download
        label: Download principal (todas as plataformas)
        type: file
        description: Arquivo principal compartilhado por todas as plataformas.
        options:
          media: downloads
          path: projetos
          extensions: [zip]
      - name: additional_downloads
        label: Downloads complementares
        type: object
        description: Adicione aqui arquivos específicos de uma plataforma ou complementos opcionais. Cada item pode ter sua própria observação.
        list:
          collapsible:
            collapsed: true
            summary: "{platform} — {file}"
        fields:
          - name: file
            label: Arquivo complementar
            type: file
            options:
              media: downloads
              path: projetos
              extensions: [zip]
          - name: platform
            label: Plataforma relacionada
            type: select
            options:
              values:
                - Nintendo Switch 2
                - Nintendo Switch
                - PC
                - PlayStation 5
                - PlayStation 4
                - PlayStation 3
                - Xbox Series X|S
                - Xbox One
                - Xbox 360
                - Wii U
                - Wii
                - Nintendo 3DS
                - Nintendo DS
                - PlayStation Vita
                - PSP
                - Android
                - iOS
          - name: note
            label: Observação
            type: text
      - name: version_history
        label: Histórico de atualizações
        type: object
        description: Registre cada atualização com sua versão, data e resumo das mudanças. Adicione uma nova entrada sempre que publicar uma versão.
        list:
          collapsible:
            collapsed: true
            summary: "Versão {version} — {date}"
        fields:
          - name: version
            label: Versão
            type: string
            required: true
          - name: date
            label: Data da atualização
            type: date
          - name: changes
            label: O que mudou nesta versão
            type: text
      - name: body
        label: Descrição e instruções
        type: rich-text
