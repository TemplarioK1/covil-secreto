media:
  - name: images
    label: Imagens dos projetos
    input: media/images
    output: /media/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: downloads
    label: Downloads
    input: downloads
    output: /downloads
    categories: [compressed]
    extensions: [zip]
    rename: safe

content:
  - name: projetos
    label: Projetos
    type: collection
    path: _projetos
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - category
        - platform
        - status
        - version
    actions:
      - name: organize-project-media
        label: Organizar e otimizar imagens
        scope: entry
        workflow: process-project-media.yml
        ref: current
        confirm:
          title: Processar imagens deste projeto?
          message: As imagens serão redimensionadas, convertidas para WebP, reunidas na pasta deste projeto e os caminhos serão atualizados.
          button: Processar imagens
    fields:
      - name: title
        label: Nome do jogo
        type: string
        required: true
      - name: category
        label: Categoria
        type: select
        options:
          values:
            - Tradução
            - Port
            - Projeto
      - name: platform
        label: Plataformas
        type: string
        description: Informe todas as plataformas separadas por vírgula. Ex.: Nintendo Switch, PC
      - name: status
        label: Status
        type: select
        options:
          values:
            - Concluído
            - Em andamento
            - Cancelado
            - Em planejamento
      - name: version
        label: Versão
        type: string
      - name: date
        label: Data de publicação
        type: date
      - name: icon
        label: Ícone do card na página inicial
        type: image
        options:
          media: images
          path: projetos/icones
          extensions: [png, jpg, jpeg, webp]
      - name: cover
        label: Imagem de título / capa da página
        type: image
        options:
          media: images
          path: projetos/capas
          extensions: [jpg, jpeg, png, webp]
      - name: screenshots
        label: Galeria antiga (mantida para projetos existentes)
        type: image
        hidden: true
        options:
          media: images
          path: projetos/screenshots
          multiple:
            max: 4
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_1
        label: Screenshot 1
        type: image
        options:
          media: images
          path: projetos/screenshots
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_2
        label: Screenshot 2
        type: image
        options:
          media: images
          path: projetos/screenshots
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_3
        label: Screenshot 3
        type: image
        options:
          media: images
          path: projetos/screenshots
          extensions: [jpg, jpeg, png, webp]
      - name: screenshot_4
        label: Screenshot 4
        type: image
        options:
          media: images
          path: projetos/screenshots
          extensions: [jpg, jpeg, png, webp]
      - name: youtube
        label: Link do vídeo no YouTube
        type: string
        description: Cole o link completo do vídeo do YouTube (opcional).
      - name: download
        label: Arquivo ZIP para download
        type: file
        options:
          media: downloads
          path: projetos
          extensions: [zip]
      - name: body
        label: Descrição e instruções
        type: rich-text
