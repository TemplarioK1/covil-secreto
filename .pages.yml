
media:
  input: media
  output: /covil-secreto/media

content:
  - name: projetos
    label: Projetos
    type: collection
    path: projetos
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - category
        - platform
        - status
    fields:
      - name: title
        label: Nome do jogo
        type: string
        required: true

      - name: category
        label: Categoria
        type: select
        options:
          values:
            - Tradução
            - Port

      - name: platform
        label: Plataforma
        type: string

      - name: status
        label: Status
        type: select
        options:
          values:
            - Concluído
            - Em andamento
            - Cancelado

      - name: version
        label: Versão
        type: string

      - name: date
        label: Data de publicação
        type: date

      - name: cover
        label: Capa do jogo
        type: image

      - name: screenshots
        label: Imagens do projeto
        type: image
        list: true

      - name: download
        label: Link de download
        type: string

      - name: body
        label: Descrição e instruções
        type: rich-text
