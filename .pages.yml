media:
  - name: images
    label: Imagens dos projetos
    input: media/images
    output: /media/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: downloads
    label: Downloads
    input: downloads
    output: /downloads
    categories: [compressed]
    extensions: [zip]
    rename: safe

content:
  - name: projetos
    label: Projetos
    type: collection
    path: _projetos
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - category
        - platform
        - status
        - version
    fields:
      - name: title
        label: Nome do jogo
        type: string
        required: true
      - name: category
        label: Categoria
        type: select
        options:
          values:
            - Tradução
            - Port
            - Projeto
      - name: platform
        label: Plataforma
        type: string
      - name: status
        label: Status
        type: select
        options:
          values:
            - Concluído
            - Em andamento
            - Cancelado
            - Em planejamento
      - name: version
        label: Versão
        type: string
      - name: date
        label: Data de publicação
        type: date
      - name: icon
        label: Ícone do card na página inicial
        type: image
        options:
          media: images
          path: projetos/icones
          extensions: [png, jpg, jpeg, webp]
      - name: cover
        label: Imagem de título / capa da página
        type: image
        options:
          media: images
          path: projetos/capas
          extensions: [jpg, jpeg, png, webp]
      - name: screenshots
        label: Screenshots / galeria (até 4 imagens)
        type: image
        options:
          media: images
          path: projetos/screenshots
          multiple:
            max: 4
          extensions: [jpg, jpeg, png, webp]
      - name: download
        label: Arquivo ZIP para download
        type: file
        options:
          media: downloads
          path: projetos
          extensions: [zip]
      - name: body
        label: Descrição e instruções
        type: rich-text
