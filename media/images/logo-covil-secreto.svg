<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Covil Secreto</title>
<desc id="desc">Emblema geométrico de um esconderijo com capuz e controle de videogame, ao lado do nome Covil Secreto em azul-petróleo, roxo e ciano.</desc>
<defs>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00eaff"/><stop offset=".55" stop-color="#087d9e"/><stop offset="1" stop-color="#07364d"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e34cff"/><stop offset=".55" stop-color="#9828df"/><stop offset="1" stop-color="#45118d"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9fb8ca"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- geometric hideout crest -->
<path d="M154 15 275 82 275 207 154 292 33 207 33 82Z" fill="#071725" stroke="#44218d" stroke-width="9"/>
<path d="M154 29 261 89 261 199 154 274 47 199 47 89Z" fill="#092b3b" stroke="url(#teal)" stroke-width="8"/>
<path d="M154 53 226 96 241 177 201 231 154 255 107 231 67 177 82 96Z" fill="#061522" stroke="#087d9e" stroke-width="5"/>
<!-- hood -->
<path d="M82 176Q81 89 154 64Q227 89 226 176L204 204 185 150 154 128 123 150 104 204Z" fill="#0a4056" stroke="#0acbe4" stroke-width="5" stroke-linejoin="round"/>
<path d="M113 164 139 174 126 184Z M195 164 169 174 182 184Z" fill="#00eaff" filter="url(#glow)"/>
<!-- controller -->
<path d="M84 190Q98 176 120 181L154 187 188 181Q210 176 224 190L242 224Q249 243 232 249L207 246 188 226H120L101 246 76 249Q59 243 66 224Z" fill="#071b2a" stroke="#00d9ee" stroke-width="6" stroke-linejoin="round"/>
<path d="M103 207v25m-12-12h24" stroke="#08d9ef" stroke-width="7" stroke-linecap="round"/>
<g fill="#a83be9" stroke="#e05aff" stroke-width="2"><circle cx="194" cy="207" r="6"/><circle cx="211" cy="222" r="6"/></g>
<path d="M141 217h25" stroke="#00d9ee" stroke-width="6" stroke-linecap="round"/>
<path d="M30 225 9 242h44M278 225l21 17h-44" fill="none" stroke="#00d9ee" stroke-width="6" stroke-linecap="round"/>
<!-- wordmark -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic" letter-spacing="3">
 <text x="330" y="150" font-size="118" fill="#061522" stroke="#073d54" stroke-width="15" paint-order="stroke">COVIL</text>
 <text x="330" y="150" font-size="118" fill="url(#silver)">COVIL</text>
 <text x="330" y="265" font-size="112" fill="#160b2b" stroke="#42117f" stroke-width="15" paint-order="stroke">SECRETO</text>
 <text x="330" y="265" font-size="112" fill="url(#purple)">SECRETO</text>
</g>
<path d="M330 283H1148l28-18" fill="none" stroke="#00d9ee" stroke-width="6" stroke-linecap="round"/>
