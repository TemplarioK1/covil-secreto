name: Processar imagens do projeto e publicar o site

on:
  push:
    branches:
      - main
    paths:
      - "_projetos/**"
      - "media/images/**"
      - "scripts/**"
      - "downloads/**"
      - "index.html"
      - "projetos.json"
      - "_layouts/**"
      - "_config.yml"
      - ".pages.yml"
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto enviado pelo Pages CMS
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: covil-secreto-pages
  cancel-in-progress: false

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de imagem
        run: |
          python -m pip install --upgrade pip
          pip install Pillow PyYAML

      - name: Identificar projeto enviado pelo Pages CMS
        id: project
        if: github.event_name == 'workflow_dispatch'
        env:
          CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          python - <<'PY'
          import json, os
          payload = json.loads(os.environ["CMS_PAYLOAD"])
          path = payload.get("context", {}).get("path", "")
          if not path.startswith("_projetos/") or not path.endswith(".md") or "/" in path[len("_projetos/"):]:
              raise SystemExit(f"Caminho de projeto inválido recebido do CMS: {path!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={path}\n")
          PY

      - name: Organizar imagens do projeto selecionado
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/optimize_project_media.py --project "${{ steps.project.outputs.path }}"

      - name: Organizar imagens de todos os projetos
        if: github.event_name == 'push'
        run: python scripts/optimize_project_media.py --all

      - name: Salvar imagens otimizadas no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _projetos media/images downloads
          if ! git diff --cached --quiet; then
            git commit -m "Organiza e otimiza imagens do projeto"
            git push
          else
            echo "Nenhuma alteração de mídia para salvar."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar site com Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
